name: Bug report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below.

  - type: checkboxes
    id: versions
    attributes:
      label: Affected versions
      description: Select every version where you can reproduce the bug.
      options:
        - label: "3.8"
          default: true
        - label: "3.7"
          default: true
        - label: "3.6"
          default: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run '...'
        2. Press '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include any error messages or logs.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system and terminal
      placeholder: e.g. Ubuntu 24.04, GNOME Terminal
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, recordings, or anything else that might help.
    validations:
      required: false
